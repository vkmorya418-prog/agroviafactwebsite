<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGROVIA FACT - Agriculture Knowledge & Affiliate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-green-50">
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        // यहाँ आपके सारे फैक्ट्स सेव हैं (इन्हें आप भविष्य में बढ़ा भी सकते हैं)
        const factsData = [
            { id: 1, icon: '🍅', tag: 'रोचक तथ्य', tagClasses: 'bg-green-100 text-green-800', title: 'टमाटर सब्जी है या फल?', desc: 'वैज्ञानिक दृष्टि से टमाटर एक फल (Fruit) है, क्योंकि इसमें बीज होते हैं और यह फूल से विकसित होता है। लेकिन रसोई में इसे सब्जी माना जाता है!' },
            { id: 2, icon: '🌱', tag: 'फसल ज्ञान', tagClasses: 'bg-green-100 text-green-800', title: 'मिट्टी की जाँच क्यों है ज़रूरी?', desc: 'मिट्टी परीक्षण से पता चलता है कि खेत में किस पोषक तत्व की कमी है। इससे खाद का सही उपयोग होता है और फसल की पैदावार 20% तक बढ़ सकती है।' },
            { id: 3, icon: '🍈', tag: 'बागवानी', tagClasses: 'bg-orange-100 text-orange-800', title: 'पपीते की खेती में सावधानी', desc: 'पपीते के पौधों के पास पानी का जमाव सबसे हानिकारक होता है। इससे तना गलन (Collar Rot) रोग हो सकता है। खेत में जल निकासी अच्छी होनी चाहिए।' },
            { id: 4, icon: '🌍', tag: 'कृषि विज्ञान', tagClasses: 'bg-blue-100 text-blue-800', title: 'भारत की प्रमुख मिट्टियाँ', desc: 'ICAR के अनुसार, भारत में 8 प्रमुख प्रकार की मिट्टियाँ हैं। इनमें जलोढ़ मिट्टी (Alluvial Soil) सबसे उपजाऊ और खेती के लिए उत्तम मानी जाती है।' },
            { id: 5, icon: '🥭', tag: 'फलों का राजा', tagClasses: 'bg-yellow-100 text-yellow-800', title: 'आम (Mango) की खेती', desc: 'भारत में आम (Mango) की खेती हज़ारों सालों से हो रही है। उत्तर प्रदेश और महाराष्ट्र इसके प्रमुख उत्पादक हैं। दशहरी आम बहुत लोकप्रिय है।' }
        ];

        function App() {
            // सर्च करने के लिए नया सिस्टम
            const [searchTerm, setSearchTerm] = useState('');

            // जो सर्च किया गया है, उसके हिसाब से आर्टिकल्स छांटना
            const filteredFacts = factsData.filter(fact => 
                fact.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                fact.desc.toLowerCase().includes(searchTerm.toLowerCase()) ||
                fact.tag.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="font-sans text-gray-800 pb-10">
                    {/* Header */}
                    <header className="bg-green-700 text-white p-4 shadow-md sticky top-0 z-50">
                        <div className="container mx-auto flex justify-between items-center">
                            <h1 className="text-2xl font-bold tracking-wider">AGROVIA FACT</h1>
                            <button className="md:hidden text-white border border-white px-2 py-1 rounded">
                                मेनू
                            </button>
                            <nav className="hidden md:block">
                                <ul className="flex space-x-6 font-semibold">
                                    <li><a href="#" className="hover:text-green-200">होम</a></li>
                                    <li><a href="#" className="hover:text-green-200">कृषि तथ्य</a></li>
                                    <li><a href="#" className="hover:text-green-200">अनुशंसित उत्पाद</a></li>
                                </ul>
                            </nav>
                        </div>
                    </header>

                    {/* Hero Section */}
                    <section className="bg-green-600 text-white py-12 px-4 text-center shadow-inner">
                        <h2 className="text-3xl md:text-4xl font-bold mb-4">भारतीय किसानों और छात्रों के लिए कृषि ज्ञान</h2>
                        <p className="mb-6 text-lg md:text-xl text-green-100">खेती के रोचक तथ्य, फसल की जानकारी और बेहतरीन कृषि उत्पाद</p>
                        <input 
                            type="text" 
                            placeholder="कृषि जानकारी खोजें (जैसे: Mango, टमाटर, मिट्टी)..." 
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            className="px-4 py-2 w-3/4 md:w-1/2 text-black rounded shadow-md focus:outline-none focus:ring-2 focus:ring-green-400"
                        />
                    </section>

                    {/* Content Area - Agrovia Facts */}
                    <main className="container mx-auto p-4 mt-6">
                        <h3 className="text-2xl font-bold border-b-4 border-green-600 pb-2 mb-6 text-green-900">
                            {searchTerm ? `"${searchTerm}" के लिए खोज परिणाम` : 'आज के कृषि तथ्य (AGROVIA FACTS)'}
                        </h3>
                        
                        {filteredFacts.length > 0 ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredFacts.map(fact => (
                                    <div key={fact.id} className="bg-white rounded-lg shadow-lg overflow-hidden border border-green-100 hover:shadow-xl transition">
                                        <div className="bg-green-100 h-32 flex items-center justify-center text-5xl">
                                            {fact.icon}
                                        </div>
                                        <div className="p-4">
                                            <span className={`${fact.tagClasses} text-xs font-semibold px-2 py-1 rounded`}>
                                                {fact.tag}
                                            </span>
                                            <h4 className="font-bold text-lg text-gray-900 mt-2">{fact.title}</h4>
                                            <p className="text-sm mt-2 text-gray-600">{fact.desc}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-10 bg-white rounded-lg shadow border border-gray-200">
                                <p className="text-xl text-gray-500">"{searchTerm}" के लिए कोई जानकारी नहीं मिली।</p>
                                <p className="text-sm text-gray-400 mt-2">कृपया कोई और शब्द लिखकर खोजें (जैसे: पपीता, मिट्टी)।</p>
                            </div>
                        )}
                    </main>

                    {/* Affiliate / Recommended Products Section */}
                    <section className="bg-gray-100 py-10 px-4 mt-8">
                        <div className="container mx-auto">
                            <h3 className="text-2xl font-bold border-b-4 border-green-600 pb-2 mb-6 text-green-900">अनुशंसित कृषि उत्पाद (Buy Online)</h3>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {/* Product 1 */}
                                <div className="bg-white p-4 rounded shadow border border-gray-200 flex flex-col items-center text-center">
                                    <div className="w-full bg-green-50 h-40 flex items-center justify-center rounded text-6xl mb-4">
                                        🔋
                                    </div>
                                    <span className="text-xs font-bold text-red-500 mb-1">Best Seller</span>
                                    <h4 className="font-bold text-xl text-gray-800">16L बैटरी वाला कृषि स्प्रेयर</h4>
                                    <p className="text-sm text-gray-600 mt-2 mb-4">खेतों में कीटनाशक और खाद छिड़कने के लिए बेहतरीन। एक बार चार्ज करने पर घंटों काम करता है।</p>
                                    <div className="mt-auto">
                                        <span className="text-lg font-bold text-green-700 block mb-2">₹2,200*</span>
                                        <a href="#" className="bg-orange-500 text-white font-bold py-2 px-6 rounded shadow hover:bg-orange-600 transition inline-block">
                                            Amazon से खरीदें
                                        </a>
                                    </div>
                                </div>

                                {/* Product 2 */}
                                <div className="bg-white p-4 rounded shadow border border-gray-200 flex flex-col items-center text-center">
                                    <div className="w-full bg-green-50 h-40 flex items-center justify-center rounded text-6xl mb-4">
                                        🪱
                                    </div>
                                    <span className="text-xs font-bold text-green-600 mb-1">Organic Farming</span>
                                    <h4 className="font-bold text-xl text-gray-800">वर्मीकम्पोस्ट (जैविक खाद) - 5Kg</h4>
                                    <p className="text-sm text-gray-600 mt-2 mb-4">केंचुए से तैयार 100% शुद्ध जैविक खाद। यह मिट्टी की उपजाऊ क्षमता बढ़ाती है और पौधों का तेज़ी से विकास करती है।</p>
                                    <div className="mt-auto">
                                        <span className="text-lg font-bold text-green-700 block mb-2">₹350*</span>
                                        <a href="#" className="bg-orange-500 text-white font-bold py-2 px-6 rounded shadow hover:bg-orange-600 transition inline-block">
                                            Amazon से खरीदें
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                    
                    {/* Footer */}
                    <footer className="bg-gray-900 text-gray-300 text-center p-6 mt-12">
                        <div className="mb-4 space-x-4 font-semibold">
                            <a href="#" className="hover:text-green-400">हमारे बारे में (About Us)</a> | 
                            <a href="#" className="hover:text-green-400">संपर्क करें (Contact)</a> | 
                            <a href="#" className="hover:text-green-400">Privacy Policy</a>
                        </div>
                        <p>&copy; 2026 AGROVIA FACT. सर्वाधिकार सुरक्षित।</p>
                    </footer>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
